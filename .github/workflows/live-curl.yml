name: Live-curl regression gate

on:
  workflow_dispatch:
  push:
    branches: [main]

# Live-curl regression gate.
#
# The rate-limit window and tenant_appointments LEAD rows are ephemeral by
# design — they live only inside this job's local Supabase stack and are torn
# down in the final cleanup step, so nothing here pollutes the dev environment.
#
# ZERO-CONFIG: this workflow derives ALL Supabase credentials from the local
# stack via `supabase status -o env` (see "Export Local Supabase Keys to
# Environment"). No CI_SUPABASE_* secrets are required — the same pattern as
# zeeder-ci.yml. This avoids port drift (the local Postgres runs on 54322 per
# supabase/config.toml, not 5432) and keeps the anon/service-role keys in sync
# with whatever `supabase start` generated.
#
# Required GitHub Encrypted Secrets (repo or a `ci` environment):
#   CI_GROQ_API_KEY           real Groq key — FAIL-CLOSED if absent (see test stage)
# Migration 012 (booking_slots / booking_appointments / reserve_booking_slot) is
# intentionally NEVER applied here (out of scope for these four scenarios).

concurrency:
  group: live-curl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-curl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI_TENANT_SLUG: ci-live-curl
      CI_FIXED_IP: 203.0.113.77
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Local Supabase stack (required before any migration/test step) ────
      - name: Initialize Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Docker daemon is healthy
        run: |
          set -euo pipefail
          if ! docker info >/dev/null 2>&1; then
            echo "::error::Docker daemon is not running. `supabase start` requires Docker."
            exit 1
          fi
          echo "Docker daemon is healthy."
          docker ps

      - name: Verify Supabase config exists
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            echo "::error::supabase/config.toml not found. Run `supabase init` or commit the file."
            exit 1
          fi
          echo "Supabase config.toml present."

      # `supabase start` pulls its container images from the Amazon ECR Public
      # registry by default. GitHub-hosted runners share massive public IP
      # ranges across thousands of concurrent builds, so anonymous pulls from
      # ECR Public routinely hit IP-based rate limits ("toomanyrequests:
      # Data limit exceeded"). Routing pulls to Docker Hub via
      # SUPABASE_INTERNAL_IMAGE_REGISTRY lifts the anonymous quota and is the
      # canonical fix (confirmed in supabase/cli#3361 and the CLI source in
      # internal/utils/docker.go).
      #
      # --exclude trims the pull footprint for a migration/seed/API gate that
      # does not need Studio, Storage, Realtime, Edge Runtime, Vector, Logflare,
      # Supavisor, ImgProxy, or Mailpit. Note: the schema-init path can still
      # pull gotrue/realtime/storage-api images even when excluded, so those
      # three services are also disabled in supabase/config.toml to guarantee
      # the exclusion actually reduces pulls.
      - name: Start Local Supabase Stack
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
        run: |
          supabase start --exclude storage-api,realtime,studio,edge-runtime,vector,logflare,supavisor,imgproxy,mailpit

      # Pull the local instance's active keys straight from the CLI in machine-readable
      # env format. This acts as both the export mechanism and the health check:
      # if the stack isn't responding, this command fails cleanly with a non-zero
      # exit code — no brittle grep against human-readable CLI output tables.
      # Verified override names against the CLI source
      # (internal/status/status.go CustomName struct):
      #   api.url            -> NEXT_PUBLIC_SUPABASE_URL
      #   auth.anon_key      -> NEXT_PUBLIC_SUPABASE_ANON_KEY
      #   auth.service_role_key -> SUPABASE_SERVICE_ROLE_KEY
      #   db.port            -> SUPABASE_DB_PORT
      #
      # CRITICAL — quote stripping: `supabase status -o env` emits
      # `export KEY="value"` lines. A naive `sed 's/^export //'` leaves the
      # surrounding double-quotes in place, so $GITHUB_ENV ends up with
      # NEXT_PUBLIC_SUPABASE_URL="http://..." (literal quotes). Next.js then
      # rejects it at build/runtime as "Invalid supabaseUrl: Must be a valid
      # HTTP or HTTPS URL". The loop below strips BOTH the `export ` prefix and
      # the wrapping quotes before anything reaches $GITHUB_ENV.
      # File redirection (not a pipe) is used so the sourced values remain
      # visible to the validation tests in THIS step — a piped `while` would
      # run in a subshell and silently empty them.
      - name: Export Local Supabase Keys to Environment
        shell: bash
        run: |
          set -euo pipefail

          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            --override-name db.port=SUPABASE_DB_PORT \
            > /tmp/supabase.raw

          while IFS='=' read -r key val; do
            # Strip 'export ' prefix if present on the key
            key="${key#export }"
            # Strip leading and trailing double-quotes from the value
            val="${val%\"}"
            val="${val#\"}"
            echo "$key=$val" >> /tmp/supabase.clean
          done < /tmp/supabase.raw

          # Source the cleaned file so the validation tests below can see the
          # values, then promote it to $GITHUB_ENV for downstream steps.
          set -a
          source /tmp/supabase.clean
          set +a

          cat /tmp/supabase.clean >> "$GITHUB_ENV"

          test -n "${NEXT_PUBLIC_SUPABASE_URL:-}"
          test -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}"
          test -n "${SUPABASE_DB_PORT:-}"

          case "$NEXT_PUBLIC_SUPABASE_URL" in
            http://*|https://*) ;;
            *)
              echo "::error::Invalid NEXT_PUBLIC_SUPABASE_URL: $NEXT_PUBLIC_SUPABASE_URL"
              exit 1
              ;;
          esac

          echo "Supabase environment variables validated."

      # Build a direct Postgres URL from the locally generated port so every
      # psql / pg_isready call below binds to the SAME ephemeral stack. This
      # replaces the old CI_SUPABASE_DB_URL secret (which pointed at a remote
      # "dedicated" project that this workflow never actually used).
      - name: Build Local Postgres URL
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "SUPABASE_DB_URL=postgresql://postgres:postgres@127.0.0.1:${SUPABASE_DB_PORT}/postgres"
          } >> "$GITHUB_ENV"
          echo "Direct Postgres URL built for port ${SUPABASE_DB_PORT}."

      # Apply every migration EXCEPT the booking-bridge (012) which is out of
      # scope. tenant_appointments is created by 003_pre_baseline (sorted before
      # 012), so skipping 012 does not break the LEAD read-back.
      - name: Apply migrations (exclude 012) to local stack
        run: |
          set -euo pipefail
          for f in $(ls supabase/migrations/*.sql | sort); do
            case "$(basename "$f")" in
              012_create_booking_bridge_schema.sql) echo "SKIP (out of scope): $f";;
              *) echo "APPLY: $f"; psql -h 127.0.0.1 "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f";;
            esac
          done

      - name: Seed dedicated CI tenant
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<SQL
            INSERT INTO tenants (tenant_id, name, branding_color, voice_id, system_prompt)
            VALUES ('${CI_TENANT_SLUG}', 'CI Live-Curl Tenant', '#0097b2', 'hannah', 'CI tenant for live-curl regression gate.')
            ON CONFLICT (tenant_id) DO NOTHING;
          SQL

      # ── Boot app pointing at the local stack ───────────────────────────────
      - name: Start next dev
        run: npm run dev > /tmp/next-dev.log 2>&1 &

      - name: Wait for server
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "$APP_URL/" 2>/dev/null; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server did not start"; cat /tmp/next-dev.log; exit 1

      # ── Live-curl regression scenarios ────────────────────────────────────
      - name: FAST GATE — vitest (anon-security-boundary banked)
        run: npm test

      - name: FAIL-CLOSED — require real Groq key for CHAT/BOOK/HELP
        env:
          CI_GROQ_API_KEY: ${{ secrets.CI_GROQ_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CI_GROQ_API_KEY:-}" ]; then
            echo "::error::CI_GROQ_API_KEY secret is missing. CHAT/BOOK/HELP would hit the local fallback — not a real gate. Aborting."
            exit 1
          fi
          echo "GROQ_API_KEY present — CHAT/BOOK/HELP will exercise the real LLM path."

      - name: Scenario — CORS preflight
        run: |
          set -euo pipefail
          out=$(curl -sS -i -X OPTIONS \
            -H "Origin: https://example.com" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: Content-Type" \
            "$APP_URL/api/client/process-command")
          echo "$out"
          echo "$out" | grep -qi "HTTP/1.1 204" || { echo "CORS: expected 204"; exit 1; }
          echo "$out" | grep -qi "access-control-allow-origin: \*" || { echo "CORS: expected ACAO *"; exit 1; }

      - name: Scenario — CHAT (conversational, real LLM)
        env:
          CI_GROQ_API_KEY: ${{ secrets.CI_GROQ_API_KEY }}
        run: |
          set -euo pipefail
          export GROQ_API_KEY="$CI_GROQ_API_KEY"
          body=$(jq -n --arg t "$CI_TENANT_SLUG" '{tenantId:$t, text:"What is smart booking?"}')
          resp=$(curl -sS -X POST "$APP_URL/api/client/process-command" \
            -H "Content-Type: application/json" \
            -H "X-Forwarded-For: $CI_FIXED_IP" \
            -d "$body")
          echo "$resp"
          echo "$resp" | jq -e '.success==true' >/dev/null || { echo "CHAT: success!=true"; exit 1; }
          echo "$resp" | jq -e '.summary' >/dev/null || { echo "CHAT: no summary"; exit 1; }

      - name: Scenario — BOOK-as-LEAD (real LLM + LEAD insert read-back)
        env:
          CI_GROQ_API_KEY: ${{ secrets.CI_GROQ_API_KEY }}
        run: |
          set -euo pipefail
          export GROQ_API_KEY="$CI_GROQ_API_KEY"
          body=$(jq -n --arg t "$CI_TENANT_SLUG" '{tenantId:$t, text:"Hi, I am Jill and I would like to book an appointment, my number is +27 82 123 4567"}')
          resp=$(curl -sS -X POST "$APP_URL/api/client/process-command" \
            -H "Content-Type: application/json" \
            -H "X-Forwarded-For: $CI_FIXED_IP" \
            -d "$body")
          echo "$resp"
          # Confirm the route produced a booking capture payload
          echo "$resp" | jq -e '.payload.phone' >/dev/null || { echo "BOOK: no phone captured"; exit 1; }
          # Read back the real LEAD row written by supabaseAdmin
          lead=$(psql -h 127.0.0.1 "$SUPABASE_DB_URL" -t -A -c "SELECT status FROM tenant_appointments WHERE tenant_id=(SELECT id FROM tenants WHERE tenant_id='${CI_TENANT_SLUG}') ORDER BY created_at DESC LIMIT 1;")
          echo "latest tenant_appointments.status = [$lead]"
          [ "$lead" = "LEAD" ] || { echo "BOOK: expected LEAD row, got [$lead]"; exit 1; }

      - name: Scenario — HELP (restricted SYSTEM_HELP)
        run: |
          set -euo pipefail
          body=$(jq -n --arg t "$CI_TENANT_SLUG" '{tenantId:$t, text:"What can you help me with?"}')
          resp=$(curl -sS -X POST "$APP_URL/api/client/process-command" \
            -H "Content-Type: application/json" \
            -H "X-Forwarded-For: $CI_FIXED_IP" \
            -d "$body")
          echo "$resp"
          echo "$resp" | jq -e '.actionType=="SYSTEM_HELP"' >/dev/null || { echo "HELP: actionType!=SYSTEM_HELP"; exit 1; }

      - name: Scenario — BRAND (anon mutation blocked)
        run: |
          set -euo pipefail
          # Anon attempting a branding mutation must NOT be applied (allowed-only actions).
          body=$(jq -n --arg t "$CI_TENANT_SLUG" '{tenantId:$t, text:"change my brand color to red", actionId:"updateBranding", payload:{brandingColor:"#ff0000"}}')
          resp=$(curl -sS -X POST "$APP_URL/api/client/process-command" \
            -H "Content-Type: application/json" \
            -H "X-Forwarded-For: $CI_FIXED_IP" \
            -d "$body")
          echo "$resp"
          # Anon must not surface a branding mutation action
          echo "$resp" | jq -e '.actionType!="SYSTEM_UPDATE_BRANDING"' >/dev/null || { echo "BRAND: anon branding mutation was allowed"; exit 1; }

      - name: Scenario — RATE-LIMIT burst (429 on 16th)
        run: |
          set -euo pipefail
          burst_ip="198.51.100.23"
          url="$APP_URL/api/client/process-command"
          ok=0; limited=0
          for i in $(seq 1 16); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$url" \
              -H "Content-Type: application/json" \
              -H "X-Forwarded-For: $burst_ip" \
              -d "{\"tenantId\":\"$CI_TENANT_SLUG\",\"text\":\"hello $i\"}")
            if [ "$code" = "200" ]; then ok=$((ok+1));
            elif [ "$code" = "429" ]; then limited=$((limited+1));
            else echo "BURST: unexpected code $code on req $i"; exit 1; fi
          done
          echo "burst: 200s=$ok 429s=$limited"
          [ "$ok" = "15" ] || { echo "BURST: expected exactly 15x200 (got $ok)"; exit 1; }
          [ "$limited" = "1" ] || { echo "BURST: expected exactly 1x429 (got $limited)"; exit 1; }

      # ── Tear down ─────────────────────────────────────────────────────────
      - name: Cleanup CI tenant rate/lead rows
        if: always()
        run: |
          set -euo pipefail
          if ! pg_isready -h 127.0.0.1 -p "$SUPABASE_DB_PORT" -q; then
            echo "DB not reachable, skipping cleanup"
            exit 0
          fi
          psql -h 127.0.0.1 "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<SQL
            DELETE FROM rate_limits WHERE key LIKE 't:${CI_TENANT_SLUG}|%' OR key = 't:${CI_TENANT_SLUG}';
            DELETE FROM tenant_appointments WHERE tenant_id = (SELECT id FROM tenants WHERE tenant_id='${CI_TENANT_SLUG}');
          SQL

      - name: Stop dev server
        if: always()
        run: pkill -f "next dev" || true
