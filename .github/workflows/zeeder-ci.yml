name: Zeeder CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  verify-and-test:
    name: Lint, Migrate, and Test Execution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Initialize Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Docker is required by `supabase start` (it runs Postgres, Studio, and
      # the Auth/Gotrue containers). On ubuntu-latest the daemon is pre-installed
      # but not always healthy on first use, so verify it explicitly BEFORE
      # invoking supabase so the failure message names the real cause instead
      # of a bare exit code 1 from `supabase start`.
      - name: Verify Docker daemon is healthy
        run: |
          set -euo pipefail
          if ! docker info >/dev/null 2>&1; then
            echo "::error::Docker daemon is not running. `supabase start` requires Docker."
            exit 1
          fi
          echo "Docker daemon is healthy."
          docker ps

      - name: Verify Supabase config exists
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            echo "::error::supabase/config.toml not found. Run `supabase init` or commit the file."
            exit 1
          fi
          echo "Supabase config.toml present."

      # `supabase start` pulls its container images from the Amazon ECR Public
      # registry by default. GitHub-hosted runners share massive public IP
      # ranges across thousands of concurrent builds, so anonymous pulls from
      # ECR Public routinely hit IP-based rate limits ("toomanyrequests:
      # Data limit exceeded"). Routing pulls to Docker Hub via
      # SUPABASE_INTERNAL_IMAGE_REGISTRY lifts the anonymous quota and is the
      # canonical fix (confirmed in supabase/cli#3361 and the CLI source in
      # internal/utils/docker.go).
      #
      # --exclude trims the pull footprint for a migration/seed/API gate that
      # does not need Studio, Storage, Realtime, Edge Runtime, Vector, Logflare,
      # Supavisor, ImgProxy, or Mailpit. Note: the schema-init path can still
      # pull gotrue/realtime/storage-api images even when excluded, so those
      # three services are also disabled in supabase/config.toml to guarantee
      # the exclusion actually reduces pulls.
      #
      # Auth (gotrue) is NOT excluded: the Next.js build imports createClient()
      # from src/lib/supabase/server.ts (pulled in by
      # src/app/api/auth/callback/route.ts), which requires
      # NEXT_PUBLIC_SUPABASE_ANON_KEY at build time. Without the gotrue
      # container, `supabase status -o env` emits no anon key and the build
      # fails with "Invalid supabaseUrl".
      - name: Start Local Supabase Stack
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
        run: |
          supabase start --exclude storage-api,realtime,studio,edge-runtime,vector,logflare,supavisor,imgproxy,mailpit

      # Pull local instance active keys straight from the CLI in machine-readable
      # env format. This acts as both the export mechanism and the health check:
      # if the stack isn't responding, this command fails cleanly with a non-zero
      # exit code — no brittle grep against human-readable CLI output tables.
      # Verified override names against the CLI source
      # (internal/status/status.go CustomName struct):
      #   api.url            -> NEXT_PUBLIC_SUPABASE_URL
      #   auth.anon_key      -> NEXT_PUBLIC_SUPABASE_ANON_KEY
      #   auth.service_role_key -> SUPABASE_SERVICE_ROLE_KEY
      #
      # CRITICAL — quote stripping: `supabase status -o env` emits
      # `export KEY="value"` lines. A naive `sed 's/^export //'` leaves the
      # surrounding double-quotes in place, so $GITHUB_ENV ends up with
      # NEXT_PUBLIC_SUPABASE_URL="http://..." (literal quotes). Next.js then
      # rejects it at build/runtime as "Invalid supabaseUrl: Must be a valid
      # HTTP or HTTPS URL". The loop below strips BOTH the `export ` prefix and
      # the wrapping quotes before anything reaches $GITHUB_ENV.
      # File redirection (not a pipe) is used so the sourced values remain
      # visible to the validation tests in THIS step — a piped `while` would
      # run in a subshell and silently empty them.
      - name: Export Local Supabase Keys to Environment
        shell: bash
        run: |
          set -euo pipefail

          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            > /tmp/supabase.raw

          while IFS='=' read -r key val; do
            # Strip 'export ' prefix if present on the key
            key="${key#export }"
            # Strip leading and trailing double-quotes from the value
            val="${val%\"}"
            val="${val#\"}"
            echo "$key=$val" >> /tmp/supabase.clean
          done < /tmp/supabase.raw

          # Source the cleaned file so the validation tests below can see the
          # values, then promote it to $GITHUB_ENV for downstream steps.
          set -a
          source /tmp/supabase.clean
          set +a

          cat /tmp/supabase.clean >> "$GITHUB_ENV"

          test -n "${NEXT_PUBLIC_SUPABASE_URL:-}"
          test -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}"

          case "$NEXT_PUBLIC_SUPABASE_URL" in
            http://*|https://*) ;;
            *)
              echo "::error::Invalid NEXT_PUBLIC_SUPABASE_URL: $NEXT_PUBLIC_SUPABASE_URL"
              exit 1
              ;;
          esac

          echo "Supabase environment variables validated."

      - name: Run Schema Migrations Verification
        run: supabase db reset

      - name: Execute Vitest Engine
        run: npm test

      - name: Validate Next.js Compilation Build
        # Explicit step-level env mapping: Next.js reads NEXT_PUBLIC_SUPABASE_*
        # and SUPABASE_SERVICE_ROLE_KEY at build time (see
        # src/lib/supabase/server.ts, client.ts, admin.ts). Relying solely on
        # $GITHUB_ENV inheritance is unreliable for NEXT_PUBLIC_ vars, so the
        # keys are pinned here from the env namespace populated by the export
        # step above. Zero-config preserved — no GitHub Secrets involved.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run build