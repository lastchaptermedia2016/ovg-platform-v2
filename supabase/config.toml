# Supabase local stack configuration for the OVG Platform v2.
#
# This file is REQUIRED by `supabase start` / `supabase db reset`. Without it the
# CLI exits with "config.toml not found" (exit code 1), which is why the
# "Start Local Supabase Stack" step fails on CI.
#
# The CLI regenerates the anon + service role keys on first start and persists
# them to supabase/.temp/, so the values below are placeholders that get
# overwritten. They are committed so the file is always present.
project_id = "ovg-platform-v2"

[api]
enabled = true
port = 54321
schemas = ["public", "auth"]
extra_search_path = ["public", "auth"]

[db]
port = 54322
major_version = 15

[db.seed]
# Seeds run after `supabase start` and before `supabase db reset`.
# The order matters: tenant/reseller rows must exist before the link rows.
sql_paths = [
  "supabase/seeds/001_demo_tenant.sql",
  "supabase/seeds/003_test_reseller.sql",
  "supabase/seeds/004_link_test_user.sql",
  "supabase/seeds/005_confirm_test_user.sql",
]

[studio]
enabled = true
port = 54323

[auth]
enabled = true

[storage]
enabled = true